name: Release Cadence

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version (0.x releases are Public Beta; for example, 0.2.0)
        required: true
        type: string
      edge_commit:
        description: Commit SHA of the exact Edge build that passed testing
        required: true
        type: string
      smoke_tested:
        description: Confirm this Edge build passed the manual release smoke test
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.edge_commit }}
          fetch-depth: 0

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

      - name: Validate release candidate
        env:
          SMOKE_TESTED: ${{ inputs.smoke_tested }}
        run: |
          [[ "$SMOKE_TESTED" == "true" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          short_sha="$(git rev-parse --short=7 HEAD)"
          curl -fsSL \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/edge/appcast.xml" \
            | grep -Fq "edge.$short_sha"

      - name: Validate version and configure bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          build="$(git show -s --format=%ct HEAD)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" Resources/Info.plist

      - name: Build Cadence
        run: ./scripts/build-app.sh

      - name: Verify release application
        env:
          VERSION: ${{ inputs.version }}
        run: |
          codesign --verify --deep --strict dist/Cadence.app
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Cadence.app/Contents/Info.plist)"
          [[ "$actual_version" == "$VERSION" ]]

      - name: Create and sign Sparkle feed
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/Cadence.app "release/Cadence-$VERSION.zip"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/tapir132/cadence/releases/download/v$VERSION/" \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              -o release/appcast.xml \
              release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          title="Cadence $VERSION"
          if [[ "$VERSION" == 0.* ]]; then
            title="Cadence Beta $VERSION"
          fi
          gh release create "v$VERSION" \
            "release/Cadence-$VERSION.zip" \
            release/appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --generate-notes
