name: Release Cadence

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version (for example, 0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Validate version and configure bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          build="$(git show -s --format=%ct HEAD)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" Resources/Info.plist

      - name: Build Cadence
        run: ./scripts/build-app.sh

      - name: Create and sign Sparkle feed
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/Cadence.app "release/Cadence-$VERSION.zip"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/tapir132/whisper-live/releases/download/v$VERSION/" \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              -o appcast.xml \
              release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            "release/Cadence-$VERSION.zip" \
            release/appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cadence $VERSION" \
            --generate-notes
